<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Cairo:wght@200..1000&family=Glory:ital,wght@0,100..800;1,100..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- CSS LINKS -->
    <link rel="stylesheet" href="css/style_login.css">
    <link rel="stylesheet" href="css/responsive_auth.css">
</head>

<body>

    <main>

        <div class="img"></div>

        <div class="container">

            <div class="content">

                <div class="head">
                    <div class="logo">
                        <div class="icon">
                            <img src="imges/Icon.svg" alt="Icon">
                        </div>
                        <div class="content_logo">
                            <p>Rih<span>la</span></p>
                            <p class="egypt_travel_span">EGYPT TRAVEL</p>
                        </div>
                    </div>
                    <div class="text_content">
                        <h1>Welcome Back</h1>
                        <p>Sign in to your account to continue your journey</p>
                    </div>
                </div>

                <div class="form_login">

                    <form action="">

                        <div class="lables">

                            <label class="email">
                                Email Address
                                <input type="email" required placeholder="Mena@gmail.com">
                            </label>

                            <div class="pass">

                                <label class="password">
                                    Password
                                    <input type="password" required placeholder="*******">
                                </label>

                                <div class="radio">
                                    <label>
                                        <input type="radio">
                                        Remember me
                                    </label>
                                    <a href="forgot_password.html">
                                        <span>Forgot password?</span>
                                    </a>
                                </div>

                            </div>

                        </div>

                        <button type="submit">Login</button>

                    </form>

                    <div class="another_continue">

                        <div class="titel"><span></span>Or continue with <span></span></div>

                        <div class="btns_to_login">
                            <button><img src="imges/Icon (18).svg" alt="icon">Google</button>
                            <button><img src="imges/mdi_apple.svg" alt="icon apple">Apple</button>
                        </div>

                        
                    </div>
                    
                    <div class="create_account">
                        <span>Don't have an account? <a href="signup.html">Create account</a></span>
                    </div>

                </div>
            </div>
        </div>
    </main>

</body>

</html>
